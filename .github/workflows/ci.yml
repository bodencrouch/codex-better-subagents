name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Lint install script
        run: shellcheck install.sh
      - name: Parse TOML files
        run: python3 -c 'import tomllib,glob; [tomllib.load(open(f,"rb")) for f in glob.glob("agents/codex/*.toml")+["codex/worker.config.toml"]]'
      - name: Check plugin manifests
        run: |
          for f in .claude-plugin/*.json; do python3 -m json.tool "$f" > /dev/null; done
      - name: Check agent frontmatter
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob("agents/claude/*.md")):
              parts = open(f).read().split("---", 2)
              try:
                  meta = yaml.safe_load(parts[1]) if len(parts) == 3 else None
              except yaml.YAMLError as e:
                  meta = None
                  print(f"{f}: {e}")
              if not isinstance(meta, dict) or not {"name", "description", "model"} <= meta.keys():
                  print(f"bad frontmatter: {f}"); bad = 1
          sys.exit(bad)
          PY
      - name: Validate installable skill and evaluation records
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, re, yaml
          skill = pathlib.Path("skills/codex-better-subagents/SKILL.md")
          text = skill.read_text()
          meta = yaml.safe_load(text.split("---", 2)[1])
          assert meta["name"] == skill.parent.name
          assert re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", meta["name"])
          assert meta["description"].startswith("Use when")
          assert len(meta["description"]) <= 1024
          assert len(text.split()) < 500
          data = pathlib.Path("evals/dispatch-pressure")
          evidence = json.loads((data / "metadata.json").read_text())
          assert evidence["skill_sha256"] == hashlib.sha256(skill.read_bytes()).hexdigest()
          assert len(json.loads((data / "baseline.json").read_text())) == 5
          guided = json.loads((data / "guided.json").read_text())
          assert len(guided) == 5
          for sample in guided:
              workers = sample["decisions"]
              assert [w["model"] for w in workers] == ["gpt-6-luna", "claude-opus-5-5", "gpt-6-astra"]
              assert all(w["fresh_context"] and w["transport"] == "cli" for w in workers)
              assert all(w["reasoning_effort"] in {"low", "medium", "high"} for w in workers)
          PYCODE
      - name: Install into a staging directory
        run: |
          stage_root="$RUNNER_TEMP/codex-better-subagents"
          CODEX_BETTER_SUBAGENTS_HOME="$stage_root" ./install.sh
          cmp skills/codex-better-subagents/SKILL.md "$stage_root/.agents/skills/codex-better-subagents/SKILL.md"
          CODEX_BETTER_SUBAGENTS_HOME="$stage_root" ./install.sh
